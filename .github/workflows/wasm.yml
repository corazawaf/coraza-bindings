name: WASM / Node.js

on:
  push:
    branches: [develop, main]
    paths:
      - 'wasm/**'
      - 'nodejs/**'
      - 'scripts/build-wasm.sh'
      - '.github/workflows/wasm.yml'
  pull_request:
    paths:
      - 'wasm/**'
      - 'nodejs/**'
      - 'scripts/build-wasm.sh'
      - '.github/workflows/wasm.yml'

permissions:
  contents: read

jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '>=1.25.0'
          cache: true
          cache-dependency-path: wasm/cmd/coraza-wasm/go.sum

      - name: Cache Go module downloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/go/pkg/mod
          key: go-wasm-${{ hashFiles('wasm/cmd/coraza-wasm/go.sum') }}
          restore-keys: go-wasm-

      - name: Build WASM module
        run: bash scripts/build-wasm.sh

      - name: Upload WASM artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coraza-wasm
          path: nodejs/wasm/coraza.wasm
          if-no-files-found: error

  test-nodejs:
    name: Node.js ${{ matrix.node }} tests
    needs: build-wasm
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v5.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: nodejs/package-lock.json

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coraza-wasm
          path: nodejs/wasm/

      - name: Install dependencies
        working-directory: nodejs
        run: npm ci

      - name: Build TypeScript package
        working-directory: nodejs
        run: npm run build

      - name: Type check
        working-directory: nodejs
        run: npm run typecheck

      - name: Run tests
        working-directory: nodejs
        run: npm test
