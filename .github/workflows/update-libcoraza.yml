name: Update libcoraza

on:
  # Triggered by libcoraza's release-please workflow after a new release.
  repository_dispatch:
    types: [libcoraza-released]
  # Manual trigger (e.g. for testing or when repository_dispatch is not yet wired).
  workflow_dispatch:
    inputs:
      version:
        description: 'libcoraza version to pin (e.g. 1.2.3)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: develop

      - name: Resolve new version
        id: version
        run: |
          VERSION="${{ github.event.client_payload.version || inputs.version }}"
          # Strip leading 'v' for consistency.
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update version pins
        run: |
          echo "${{ steps.version.outputs.version }}" > python/libcoraza_version
          echo "${{ steps.version.outputs.version }}" > java/libcoraza_version

      - name: Open PR to develop
        uses: peter-evans/create-pull-request@271a8d0340266f04a3b2a8b1df91a044cc91b900 # v7.0.8
        with:
          branch: chore/update-libcoraza-${{ steps.version.outputs.version }}
          commit-message: "feat: update libcoraza to v${{ steps.version.outputs.version }}"
          title: "feat: update libcoraza to v${{ steps.version.outputs.version }}"
          body: |
            Automated update of the libcoraza version pin.

            **New version:** `${{ steps.version.outputs.version }}`

            Please review and merge manually — libcoraza upgrades may require
            binding code changes before tests will pass.
          base: develop
          # Never auto-merge: a human must review the upgrade.
          draft: false
