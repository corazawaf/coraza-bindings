name: Python

on:
  push:
    branches: [develop, main]
    paths:
      - 'python/**'
      - 'swig/coraza.i'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'python/**'
      - 'swig/coraza.i'
      - '.github/workflows/python.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-latest]
        python-version: ['3.9', '3.11', '3.13']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read libcoraza version
        id: libcoraza
        run: echo "version=$(cat python/libcoraza_version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Install Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y swig python3-dev autoconf automake libtool

      - name: Cache Homebrew packages (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-python-${{ matrix.os }}-${{ hashFiles('.github/workflows/python.yml') }}
          restore-keys: brew-python-${{ matrix.os }}-

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool swig

      - name: Cache libcoraza build
        id: cache-libcoraza
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/libcoraza-${{ steps.libcoraza.outputs.version }}
          key: libcoraza-${{ steps.libcoraza.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build libcoraza
        if: steps.cache-libcoraza.outputs.cache-hit != 'true'
        run: bash scripts/fetch-libcoraza.sh ${{ steps.libcoraza.outputs.version }}

      - name: Set LIBCORAZA_ROOT
        run: echo "LIBCORAZA_ROOT=/tmp/libcoraza-${{ steps.libcoraza.outputs.version }}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python build tools
        run: pip install scikit-build-core cmake ninja

      - name: Install coraza Python package (editable)
        working-directory: python
        run: pip install -e ".[test]"

      - name: Run tests
        working-directory: python
        run: pytest tests/ -v
