name: Java

on:
  push:
    branches: [develop, main]
    paths:
      - 'java/**'
      - 'scripts/build-native-java.sh'
      - '.github/workflows/java.yml'
  pull_request:
    paths:
      - 'java/**'
      - 'scripts/build-native-java.sh'
      - '.github/workflows/java.yml'

permissions:
  contents: read

jobs:
  build-native:
    name: JNI on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: mac-aarch64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read libcoraza version
        id: libcoraza
        run: echo "version=$(cat java/libcoraza_version | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ runner.arch }}-
            maven-${{ runner.os }}-

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y swig autoconf automake libtool

      - name: Cache Homebrew packages (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-java-${{ matrix.platform }}-${{ hashFiles('.github/workflows/java.yml') }}
          restore-keys: brew-java-${{ matrix.platform }}-

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool swig

      - name: Detect libcoraza ref type
        id: libcoraza-ref
        run: |
          v="${{ steps.libcoraza.outputs.version }}"
          if [[ "$v" =~ ^[0-9] ]] || [[ "$v" =~ ^v[0-9] ]]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache libcoraza build
        id: cache-libcoraza
        if: steps.libcoraza-ref.outputs.is_tag == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/libcoraza-${{ steps.libcoraza.outputs.version }}
          key: libcoraza-${{ steps.libcoraza.outputs.version }}-${{ matrix.platform }}

      - name: Build libcoraza
        if: steps.libcoraza-ref.outputs.is_tag != 'true' || steps.cache-libcoraza.outputs.cache-hit != 'true'
        run: bash scripts/fetch-libcoraza.sh ${{ steps.libcoraza.outputs.version }}

      - name: Set LIBCORAZA_ROOT
        run: echo "LIBCORAZA_ROOT=/tmp/libcoraza-${{ steps.libcoraza.outputs.version }}" >> "$GITHUB_ENV"

      - name: Build and test (Maven)
        working-directory: java/coraza-java
        run: mvn -B verify

      - name: Upload native library
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-${{ matrix.platform }}
          path: java/coraza-java/target/native/libcoraza_jni.*
          if-no-files-found: error

  assemble-fat-jar:
    name: Assemble fat JAR
    needs: build-native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ runner.arch }}-
            maven-${{ runner.os }}-

      - name: Download all native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: native-artifacts/
          merge-multiple: false

      - name: Place native libs into resources
        run: |
          BASE=java/coraza-java/src/main/resources/org/corazawaf/coraza/native
          for dir in native-artifacts/native-*/; do
            platform=$(basename "$dir" | sed 's/native-//')
            dest="${BASE}/${platform}"
            mkdir -p "$dest"
            cp "$dir"* "$dest/"
          done

      - name: Assemble fat JAR (skip tests — tested in build-native)
        working-directory: java/coraza-java
        run: mvn -B package -DskipTests

      - name: Upload fat JAR
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coraza-java-fat
          path: java/coraza-java/target/coraza-*.jar
          if-no-files-found: error
