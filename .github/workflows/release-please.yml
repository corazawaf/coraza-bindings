name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2379 # v4.2.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: release-please-manifest.json

      # TODO: add publish steps here when ready (PyPI / Maven Central).
      # Gate them on: if: steps.release.outputs['python--release_created'] == 'true'
      # and:          if: steps.release.outputs['java--release_created'] == 'true'
